<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Co-Working UTN{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'lista_espacios' %}">Co-Working UTN</a>
        <div>
            <a href="{% url 'lista_espacios' %}" class="btn btn-outline-light me-2">Espacios</a>
            <a href="{% url 'lista_clientes' %}" class="btn btn-outline-light me-2">Clientes</a>
            <a href="{% url 'lista_reservas' %}" class="btn btn-outline-light me-2">Reservas</a>
            <a href="/admin/" class="btn btn-warning" target="_blank">Panel Admin</a>
        </div>
    </div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
